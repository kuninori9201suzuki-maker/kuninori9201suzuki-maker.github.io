<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="代表の人物写真">
  <defs>
    <linearGradient id="bgo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#204d7c"/>
      <stop offset="60%" stop-color="#1a3f66"/>
      <stop offset="100%" stop-color="#0f2947"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bgo)"/>
  <rect x="0" y="600" width="1200" height="200" fill="#0d233c"/>
  <rect x="0" y="592" width="1200" height="8" fill="#e8622c" opacity="0.85"/>

  <!-- 代表（スーツ・正面） -->
  <g transform="translate(480 0)">
    <circle cx="0" cy="300" r="60" fill="#ffffff"/>
    <path d="M-110 660 C -110 470 -75 380 0 380 C 75 380 110 470 110 660 Z" fill="#1a3f66"/>
    <path d="M-30 400 L0 460 L30 400" fill="none" stroke="#e8622c" stroke-width="10" stroke-linejoin="round"/>
  </g>

  <!-- 工場長（作業着） -->
  <g transform="translate(760 40)">
    <circle cx="0" cy="290" r="52" fill="#ffffff"/>
    <path d="M-96 620 C -96 450 -66 370 0 370 C 66 370 96 450 96 620 Z" fill="#e8622c" opacity="0.85"/>
  </g>

  <!-- ラベル -->
  <g transform="translate(60 70)">
    <rect x="0" y="0" width="150" height="34" rx="4" fill="#e8622c"/>
    <text x="75" y="23" fill="#fff" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">MEMBERS</text>
  </g>
  <text x="60" y="150" fill="#ffffff" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="32" font-weight="700">代表・工場長</text>
</svg>
