<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700" width="1920" height="700" role="img" aria-label="工場内の広い引き">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#204d7c"/>
      <stop offset="60%" stop-color="#1a3f66"/>
      <stop offset="100%" stop-color="#0f2947"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="700" fill="url(#bgc)"/>

  <!-- 天井のトラス -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="4">
    <line x1="0" y1="120" x2="1920" y2="120"/>
    <line x1="160" y1="0" x2="160" y2="120"/>
    <line x1="480" y1="0" x2="480" y2="120"/>
    <line x1="800" y1="0" x2="800" y2="120"/>
    <line x1="1120" y1="0" x2="1120" y2="120"/>
    <line x1="1440" y1="0" x2="1440" y2="120"/>
    <line x1="1760" y1="0" x2="1760" y2="120"/>
  </g>

  <!-- 床 -->
  <rect x="0" y="560" width="1920" height="140" fill="#0d233c"/>
  <rect x="0" y="552" width="1920" height="8" fill="#e8622c" opacity="0.6"/>

  <!-- 左右に人影（中央は空ける） -->
  <g fill="#ffffff" opacity="0.85">
    <g transform="translate(220 0)">
      <circle cx="0" cy="450" r="30"/>
      <path d="M-50 560 C -50 500 -36 470 0 470 C 36 470 50 500 50 560 Z"/>
    </g>
    <g transform="translate(340 0)">
      <circle cx="0" cy="445" r="28"/>
      <path d="M-46 560 C -46 502 -33 466 0 466 C 33 466 46 502 46 560 Z"/>
    </g>
    <g transform="translate(1580 0)">
      <circle cx="0" cy="448" r="28"/>
      <path d="M-46 560 C -46 500 -33 468 0 468 C 33 468 46 500 46 560 Z"/>
    </g>
    <g transform="translate(1700 0)">
      <circle cx="0" cy="452" r="30"/>
      <path d="M-50 560 C -50 500 -36 472 0 472 C 36 472 50 500 50 560 Z"/>
    </g>
  </g>

  <!-- 中央は空けて撮影の指示どおり、什器を軽く配置 -->
  <rect x="880" y="500" width="160" height="60" rx="6" fill="#ffffff" opacity="0.1"/>
</svg>
