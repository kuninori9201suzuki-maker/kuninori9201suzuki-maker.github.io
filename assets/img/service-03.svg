  </g>

  <!-- ラベル -->
  <g transform="translate(60 70)">
    <rect x="0" y="0" width="120" height="34" rx="4" fill="#e8622c"/>
    <text x="60" y="23" fill="#fff" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">CASE 03</text>
  </g>
  <text x="60" y="150" fill="#ffffff" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="32" font-weight="700">清掃用具の組付・梱包</text>
