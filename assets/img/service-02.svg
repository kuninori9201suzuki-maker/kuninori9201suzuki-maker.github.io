    <path d="M20 -20 L 140 -80 L 140 -20" fill="#ffffff" opacity="0.9" stroke="none"/>
  </g>
  <circle cx="1040" cy="480" r="40" fill="#e8622c"/>

  <!-- ラベル -->
  <g transform="translate(60 70)">
    <rect x="0" y="0" width="120" height="34" rx="4" fill="#e8622c"/>
    <text x="60" y="23" fill="#fff" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">CASE 02</text>
  </g>
  <text x="60" y="150" fill="#ffffff" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="32" font-weight="700">介護ベッド部材の組付</text>
