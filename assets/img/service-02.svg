<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="介護ベッド部材の組付">
  <defs>
    <linearGradient id="bgs2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#204d7c"/>
      <stop offset="60%" stop-color="#1a3f66"/>
      <stop offset="100%" stop-color="#0f2947"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bgs2)"/>
  <rect x="0" y="560" width="1200" height="240" fill="#0d233c"/>
  <rect x="0" y="552" width="1200" height="8" fill="#e8622c" opacity="0.85"/>

  <!-- 人物 -->
  <g transform="translate(300 0)">
    <circle cx="0" cy="330" r="46" fill="#ffffff"/>
    <path d="M-78 610 C -78 470 -55 400 0 400 C 55 400 78 470 78 610 Z" fill="#ffffff"/>
  </g>

  <!-- 介護ベッド（フレーム） -->
  <g transform="translate(620 440)" fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round">
    <path d="M0 100 L0 -20 L 320 -20 L 320 100"/>
